# ROCm Validation Suite — Memory subsystem stress (mem module).
# Validates HBM integrity and captures memory-controller behavior under load.
# This is NOT a bandwidth test (RVS `mem` reports pass/fail integrity, not GB/s);
# `rocm-bandwidth-test` is the bandwidth ground-truth tool — see ../rocm_bw/.

actions:
- name: mem-stress-mi355x
  module: mem
  device: all
  parallel: false
  count: 1
  wait: 100
  mapped_memory: false
  mem_blocks: 128
  num_passes: 3
  thrds_per_blk: 64
  stress: true
  num_iter: 50000
