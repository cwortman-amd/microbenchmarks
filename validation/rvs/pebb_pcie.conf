# ROCm Validation Suite — PCIe / host-device bandwidth (pebb module).
# Used to confirm host-device PCIe path is healthy; not used directly in the
# roofline (the roofline uses HBM bandwidth from rocm-bandwidth-test, not PCIe).

actions:
- name: pebb-mi355x
  module: pebb
  device: all
  parallel: false
  count: 1
  wait: 100
  log_interval: 1000
  duration: 10000
  device_to_host: true
  host_to_device: true
  block_size: 1000000
