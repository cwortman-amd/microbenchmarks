# ROCm Validation Suite — GPU Stress Test (GST) for BF16 peak FLOPs.
# Cross-validates the BF16 compute roof from benchmarks/01_bf16_compute.py.
#
# RVS GST runs DGEMM/SGEMM/HGEMM (and BF16 if supported by the build) at a
# target operations/second and reports the achieved gflops_actual. We pin
# matrix_size to the size used by 01_bf16_compute.peak_tight_loop and target
# 1.36e6 GFLOPs (= 1.36 PFLOPs) — the PDF's measured MI355X peak.
#
# Adjust `target_stress` if the local build's BF16 compute path is faster or
# slower; the cross-validator only checks consistency with the PyTorch peak,
# not absolute attainment of `target_stress`.

actions:
- name: gst-bf16-mi355x
  device: all
  module: gst
  parallel: false
  count: 1
  duration: 30000          # ms
  copy_matrix: false
  ramp_interval: 5000
  log_interval: 1000
  max_violations: 1
  target_stress: 1360000   # GFLOPs (1.36 PFLOPs) — PDF-measured BF16
  tolerance: 0.10
  matrix_size: 16384
  ops_type: hgemm          # closest BF16 surrogate available across RVS builds
  data_type: rvs_blas_types_bf16
